<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===================================================== -->
  <!-- BASIC META                                             -->
  <!-- ===================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THRYLOS - Admin Dashboard</title>

  <!-- SEO -->
  <meta name="description" content="THRYLOS Admin Dashboard - Manage eSports & Betting Platforms" />
  <meta name="author" content="THRYLOS" />
  <meta name="keywords" content="THRYLOS, admin dashboard, eSports, betting, tournaments, esports admin panel" />

  <!-- Theme -->
  <meta name="theme-color" content="#020617" />
  <meta name="color-scheme" content="dark" />

  <!-- ===================================================== -->
  <!-- ICONS                                                  -->
  <!-- ===================================================== -->
  <link rel="icon" href="/dist/thrylosindia.png" />
  <link rel="apple-touch-icon" href="/dist/thrylosindia.png" />

  <!-- ===================================================== -->
  <!-- SOCIAL META                                            -->
  <!-- ===================================================== -->
  <meta property="og:title" content="THRYLOS Admin Dashboard" />
  <meta property="og:description" content="Advanced admin dashboard for managing eSports tournaments" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/dist/thrylosindia.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@THRYLOS" />
  <meta name="twitter:image" content="/dist/thrylosindia.png" />

  <!-- ===================================================== -->
  <!-- FONTS                                                  -->
  <!-- ===================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- ===================================================== -->
  <!-- GLOBAL STYLES                                          -->
  <!-- ===================================================== -->
  <style>

    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* BODY */
    body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: all 0.4s ease;
}

/* THEMES */
:root {
  --bg: linear-gradient(-45deg, #020617, #1e293b, #020617);
  --text: #ffffff;
}

.light-theme {
  --bg: #f8fafc;
  --text: #020617;
}
    <button id="themeToggle" style="
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  background: #3b82f6;
  color: white;
  cursor: pointer;
  font-size: 12px;
">
  Toggle Theme
</button>

    /* ROOT APP */
    #root {
      animation: fadeUp 0.8s ease;
    }

    /* ===================================================== */
    /* ANIMATIONS                                             */
    /* ===================================================== */

    @keyframes gradientMove {
      0% { background-position: 0% }
      100% { background-position: 100% }
    }

    @keyframes fadeUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 10px rgba(59,130,246,0.2); }
      50% { box-shadow: 0 0 25px rgba(59,130,246,0.6); }
    }

    /* ===================================================== */
    /* LOADER                                                 */
    /* ===================================================== */

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      z-index: 9999;
      backdrop-filter: blur(10px);
      flex-direction: column;
      gap: 15px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite, glowPulse 2s infinite;
    }

    .loader-text {
      font-size: 14px;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    /* ===================================================== */
    /* UTILITY CLASSES                                        */
    /* ===================================================== */

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fade-in {
      animation: fadeUp 0.6s ease;
    }

  </style>
</head>

<body>

  <!-- ===================================================== -->
  <!-- LOADER UI                                              -->
  <!-- ===================================================== -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Loading Dashboard...</div>
  </div>

  <!-- ===================================================== -->
  <!-- ROOT APP                                               -->
  <!-- ===================================================== -->
  <div id="root"></div>

  <!-- ===================================================== -->
  <!-- MAIN SCRIPT                                            -->
  <!-- ===================================================== -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- ===================================================== -->
  <!-- REMOVE LOADER                                          -->
  <!-- ===================================================== -->
  <script>
    window.addEventListener("load", () => {
      const loader = document.getElementById("loader");
      loader.style.opacity = "0";
      loader.style.transition = "opacity 0.4s ease";

      setTimeout(() => {
        loader.style.display = "none";
      }, 400);
    });
    <script>
  const btn = document.getElementById("themeToggle");

  // Load saved theme
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "light") {
    document.body.classList.add("light-theme");
  }

  btn.addEventListener("click", () => {
    document.body.classList.toggle("light-theme");

    const isLight = document.body.classList.contains("light-theme");

    localStorage.setItem("theme", isLight ? "light" : "dark");
  });
</script>
  </script>

</body>
</html>
