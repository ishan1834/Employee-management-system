<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRYLOS | Admin Dashboard</title>
    
    <meta name="description" content="Advanced admin dashboard for managing eSports tournaments and betting platforms." />
    <meta name="author" content="THRYLOS" />
    <meta name="keywords" content="THRYLOS, admin dashboard, eSports, betting, tournament management" />
    <link rel="canonical" href="https://admin.thrylos.com" />

    <link rel="icon" href="/dist/mulogo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/dist/mulogo.png" />
    <meta name="theme-color" content="#ffffff" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="THRYLOS Admin Dashboard" />
    <meta property="og:description" content="Manage eSports & Betting Platforms with the THRYLOS advanced interface." />
    <meta property="og:image" content="/dist/mulogo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THRYLOS Admin Dashboard" />
    <meta name="twitter:image" content="/dist/mulogo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">

    <style>
      /* ================= THEME SYSTEM ================= */

:root {
  --bg: #f9fafb;
  --text: #020617;
}

.dark {
  --bg: #020617;
  --text: #f9fafb;
}

body {
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s ease, color 0.3s ease;
}
      body {
        margin: 0;
        background-color: #f9fafb;
        font-family: 'Inter', sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      /* ================= LOADER ================= */

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .progress-bar {
        width: 200px;
        height: 6px;
        background: #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: #3b82f6;
        animation: load 2s ease forwards;
      }

      @keyframes load {
        to { width: 100%; }
      }

      .loader-text {
        margin-top: 10px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>

  <body>

    <!-- LOADER -->
    <div id="loader">
      <div class="spinner"></div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="loader-text">Loading Dashboard...</div>
    </div>

    <noscript>
      <div style="text-align: center; padding: 50px;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript to view the THRYLOS Admin Dashboard.</p>
      </div>
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- REMOVE LOADER -->
    <script>
      window.addEventListener("load", () => {
        const loader = document.getElementById("loader");
        loader.style.opacity = "0";
        setTimeout(() => {
          loader.style.display = "none";
        }, 400);
      });
    </script>

  </body>
</html>
